[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozzyimage-lab"
version = "0.2.0"
description = "A private Qwen Image studio for Colab, Drive and MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.124.4", "uvicorn==0.33.0", "pydantic==2.12.5",
  "pillow>=11.3,<13", "python-multipart==0.0.26", "mcp==1.26.0",
  "huggingface-hub>=0.34,<2", "pyngrok>=7.2,<8", "httpx==0.28.1", "pyyaml>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
include = ["ozzy*"]

[tool.setuptools.package-data]
ozzy = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
